name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs
      - run: pnpm docs:check
      - name: STATE.md must move with the code
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -q '^docs/STATE.md$'; then
            echo "::error::src/ changed but docs/STATE.md did not. Rewrite the handoff note (docs/CONTEXT.md)."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm test

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action posts its PR summary through the API
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # OSV-Scanner's SARIF upload needs Advanced Security, which a private repo lacks.
      # Dependency advisories via pnpm audit until M8 revisits this.
      - name: Dependency vulnerability scan
        run: pnpm audit --prod --audit-level high
