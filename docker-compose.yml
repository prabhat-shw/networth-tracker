# Production topology (ADR-0006): home machine, reachable only over Tailscale.
# Usage: cp .env.example .env && docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-networth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-networth}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-networth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the app container reaches Postgres.

  app:
    build:
      context: .
      args:
        # Stamps the build with the commit it came from:
        #   GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-networth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-networth}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:?e.g. https://networth.your-tailnet.ts.net}
      DEMO_MODE: "false"
      NODE_ENV: production
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    # Bind to the Tailscale interface only; never 0.0.0.0.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:443:443"
      - "${BIND_ADDR:-127.0.0.1}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
